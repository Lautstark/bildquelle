name: CI

on:
  push:
    branches: [main]
    # A tag is the release artifact for this package — consumers resolve
    # `#semver:` against these — so tags get the same gate as main.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before the slow steps if the tag and package.json disagree.
      # npm resolves `#semver:^1.0.0` against the tag, but a consumer that
      # installs it reads the version from package.json — so a mismatch
      # ships a package that lies about which release it is.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(npm pkg get version | tr -d '"')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $pkg"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches package.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The licensing invariant is asserted here; a failure is a licence problem,
      # not just a broken test.
      - run: npm test

      - run: npm run build

      # Consumers install from git, so `prepare` runs on their machine. If the
      # browser build breaks, it breaks at their install time, not ours.
      - run: npm run build:browser
