name: Release

# Every push to main is a candidate release. The workflow this calls runs the
# gate below and lets semantic-release read the commit subjects since the
# last tag: feat is a minor, fix a patch, feat! a major, anything else no
# release. The tag is the release - there is no registry - and nobody bumps
# the version by hand. RELEASING.md has the whole of it.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    # A called workflow can hold no more than its caller grants, so the grant
    # is written here and not only in Lautstark/.github: the release commit
    # and tag, and the issue semantic-release opens when a release fails.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Lautstark/.github/.github/workflows/release.yml@main
    with:
      # The build runs first, and that is not a preference. The shipped
      # components under `svelte/` import this package's published entries
      # rather than its own `src/` — see MetacomPanel.svelte's header — so
      # `tsc` and `svelte-check` both need `dist` on disk before they can
      # resolve `@lautstark/bildquelle`. `npm run typecheck` carries that build
      # itself, so the order cannot be undone by rewriting this line, and it is
      # why `npm run build` is not named here a second time. `build:browser` is
      # the other half of `prepare`, which runs on a consumer's machine, and it
      # stays in the gate so a change cannot break it unseen.
      gate: npm run typecheck && npm test && npm run build:browser
    secrets: inherit
